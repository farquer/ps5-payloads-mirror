name: Update farquer mirror

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-farquer-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test catalogs
        run: python3 -m unittest discover -s tests

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Run farquer update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python farquer/update_payloads.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git add farquer README.md
          git commit -m "Auto-update farquer payloads" || echo "No changes to commit"
          git pull --rebase origin main
          git push
