name: Update farquer mirror

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-farquer-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test catalogs
        run: python3 -m unittest discover -s tests

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Run farquer update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python farquer/update_payloads.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git add farquer README.md
          git commit -m "Auto-update farquer payloads" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Purge jsDelivr ghproxy JSON
        run: |
          python3 - << 'PY'
          import json
          import urllib.request

          url = "https://purge.jsdelivr.net/gh/farquer/ps5-payloads-mirror@main/farquer/payloads_ghproxy.json"
          request = urllib.request.Request(url, headers={"User-Agent": "ps5-payloads-mirror"})
          with urllib.request.urlopen(request, timeout=60) as response:
              body = response.read().decode()
          print(body)
          data = json.loads(body)
          if data.get("status") not in ("finished", "queued"):
              raise SystemExit(1)
          for info in (data.get("paths") or {}).values():
              providers = info.get("providers") or {}
              if info.get("throttled") or not all(providers.values()):
                  raise SystemExit(1)
          PY
