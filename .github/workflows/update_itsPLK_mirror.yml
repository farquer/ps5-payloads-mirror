name: Update itsPLK mirror

on:
  schedule:
    - cron: '0 16 * * *' # 北京时间 00:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-itsplk-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull latest README
        run: git pull --rebase origin main

      - name: Update itsPLK catalog and README
        run: python itsPLK/update_itsplk.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git add itsPLK README.md
          git commit -m "Auto-update itsPLK mirror" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Purge jsDelivr ghproxy JSON
        run: |
          python3 - << 'PY'
          import json
          import urllib.request

          url = "https://purge.jsdelivr.net/gh/farquer/ps5-payloads-mirror@main/itsPLK/payloads_ghproxy.json"
          request = urllib.request.Request(url, headers={"User-Agent": "ps5-payloads-mirror"})
          with urllib.request.urlopen(request, timeout=60) as response:
              body = response.read().decode()
          print(body)
          data = json.loads(body)
          if data.get("status") not in ("finished", "queued"):
              raise SystemExit(1)
          for info in (data.get("paths") or {}).values():
              providers = info.get("providers") or {}
              if info.get("throttled") or not all(providers.values()):
                  raise SystemExit(1)
          PY
